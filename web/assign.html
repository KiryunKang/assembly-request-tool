<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국회 요구자료 대응 — 배분</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>국회 요구자료 대응</h1><nav id="nav"></nav></header>
<main>
  <div id="msg"></div>

  <section>
    <h2>① 접수 — 요구서를 올려 문항으로 나눕니다</h2>
    <div class="row">
      <label>요구서 PDF(여러 개 선택 가능) <input type="file" id="pdfs" accept=".pdf" multiple></label>
      <label>또는 문항목록.csv 불러오기 <input type="file" id="csv" accept=".csv"></label>
    </div>
    <div id="checkBox"></div>
    <div id="preview"></div>
    <div class="row"><button class="primary" id="register" disabled>접수 등록</button><span class="hint" id="regHint">파일을 고르면 문항을 미리 보여 줍니다. 원문은 서버로 보내지 않고 이 브라우저에서만 읽습니다.</span></div>
  </section>

  <section>
    <h2>② 배분 — 주관 과와 협조 과를 정해 확정합니다</h2>
    <div class="row">
      <label>상태 <select id="fState"><option value="">전체</option></select></label>
      <label>의원 <select id="fMember"><option value="">전체</option></select></label>
      <span class="hint" id="count"></span>
    </div>
    <p class="hint">후보는 배분기준표(보강본) 규칙으로 계산하며 근거 키워드를 함께 보여 줍니다. 주관 과는 1순위 후보가 기본값이고, 바꾸면 확정방법이 「수정」으로 기록됩니다.</p>
    <div class="scroll" style="max-height:none">
      <table>
        <thead><tr><th>상태</th><th>의원·문항</th><th>요구내용</th><th>후보 3순위</th><th>주관 과 · 협조 과</th><th>확정</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="lib/pdf.min.js"></script>
<script src="engine.js"></script>
<script src="split.js"></script>
<script src="common.js"></script>
<script>
"use strict";
App.nav("assign.html");
pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";
const $ = (id) => document.getElementById(id), e = App.esc;
let eng = null, pending = [];

function msg(text, err) { $("msg").innerHTML = text ? `<div class="msg ${err ? "err" : ""}">${e(text)}</div>` : ""; }

// ── ① 접수 ─────────────────────────────────────────────
function showPending(checks) {
  $("checkBox").innerHTML = `<table style="margin-bottom:10px"><thead><tr><th>파일명</th><th>파일명의 문항 수</th><th>뽑은 문항 수</th><th>마지막 번호</th><th>번호 연속</th><th>일치</th></tr></thead><tbody>` +
    checks.map((c) => `<tr><td>${e(c.파일명)}</td><td>${c.기대 ?? "-"}</td><td>${c.문항수}</td><td>${c.마지막번호}</td><td>${c.번호연속 ? "O" : "X"}</td><td class="${c.일치 ? "ok" : "bad"}">${c.일치 ? "O" : "X"}</td></tr>`).join("") +
    `</tbody></table>`;
  $("preview").innerHTML = pending.length ? `<div class="scroll" style="max-height:320px;margin-bottom:10px"><table><thead><tr><th>의원·문항</th><th>요구내용</th><th>세부항목</th><th>비고</th></tr></thead><tbody>` +
    pending.map((r) => `<tr><td>${e(App.caseId(r))}</td><td>${e(r.요구내용)}</td><td>${e(r.세부항목)}</td><td>${e(r.비고)}</td></tr>`).join("") +
    `</tbody></table></div>` : "";
  $("register").disabled = !pending.length;
  $("regHint").textContent = `합계 ${pending.length}문항` + (checks.every((c) => c.일치) ? " · 모든 파일 문항 수 일치" : " · ⚠ 문항 수가 맞지 않는 파일이 있습니다. 원문을 확인하세요.");
}

$("pdfs").onchange = async (ev) => {
  const files = [...ev.target.files].sort((a, b) => a.name.localeCompare(b.name));
  if (!files.length) return;
  msg("PDF를 읽는 중입니다…");
  try {
    pending = []; const checks = [];
    for (const f of files) {
      const lines = await Split.readPdf(pdfjsLib, new Uint8Array(await f.arrayBuffer()));
      const rows = Split.splitLines(lines, f.name);
      pending.push(...rows); checks.push(Split.check(f.name, rows));
    }
    showPending(checks); msg("");
  } catch (err) { msg("PDF를 읽지 못했습니다: " + err.message, true); }
};

$("csv").onchange = async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  const rows = Engine.parseCSV(await f.text());
  const miss = Split.COLS.filter((c) => !(c in (rows[0] || {})));
  if (miss.length) { msg(`문항목록.csv 형식이 아닙니다(없는 열: ${miss.join(", ")}).`, true); return; }
  rows.forEach((r) => (r.문항번호 = Number(r.문항번호)));
  pending = rows;
  const names = [...new Set(rows.map((r) => r.파일명))];
  showPending(names.map((n) => Split.check(n, rows.filter((r) => r.파일명 === n)))); msg("");
};

$("register").onclick = () => {
  if (!pending.length) return;
  const db = App.load();
  const { added, dup } = App.register(db, pending);
  App.save(db);
  msg(`접수 등록 ${added}문항` + (dup ? ` · 이미 접수된 ${dup}문항은 건너뜀` : ""));
  pending = []; $("pdfs").value = ""; $("csv").value = "";
  $("checkBox").innerHTML = ""; $("preview").innerHTML = ""; $("register").disabled = true;
  $("regHint").textContent = "다른 요구서를 접수하려면 파일을 다시 고르세요.";
  drawAssign();
};

// ── ② 배분 ─────────────────────────────────────────────
function orgOptions(sel) {
  const byDiv = new Map();
  for (const o of eng.org) (byDiv.get(o.실국) || byDiv.set(o.실국, []).get(o.실국)).push(o.과);
  return `<option value="">— 고르세요 —</option>` + [...byDiv].map(([div, ds]) =>
    `<optgroup label="${e(div)}">` + ds.map((d) => `<option ${d === sel ? "selected" : ""}>${e(d)}</option>`).join("") + `</optgroup>`).join("");
}
function coBoxes(id, chosen) {
  return eng.org.map((o) => `<label><input type="checkbox" name="co-${e(id)}" value="${e(o.과)}" ${chosen.includes(o.과) ? "checked" : ""}> ${e(o.과)}</label>`).join("");
}

function drawAssign() {
  const db = App.load();
  const fs = $("fState").value, fm = $("fMember").value;
  // 필터 목록 채우기
  const members = [...new Set(db.cases.map((c) => c.의원))];
  $("fMember").innerHTML = `<option value="">전체</option>` + members.map((m) => `<option ${m === fm ? "selected" : ""}>${e(m)}</option>`).join("");
  const list = db.cases.filter((c) => (!fs || c.상태 === fs) && (!fm || c.의원 === fm));
  $("count").textContent = `${list.length}문항 표시 · 전체 ${db.cases.length}문항 · 배분확정 ${db.cases.filter((c) => c.상태 === "배분확정").length}`;
  if (!db.cases.length) { $("rows").innerHTML = `<tr><td colspan="6" class="hint">접수한 문항이 없습니다. 위 ① 접수에서 요구서를 올리세요.</td></tr>`; return; }

  $("rows").innerHTML = list.map((c) => {
    const cand = eng.classify(c.요구내용);
    const sel = c.주관과 || (cand[0] ? cand[0].과 : "");
    const canAssign = ["접수", "재배정요청", "배분확정"].includes(c.상태);
    const sub = [c.세부항목, c.비고].filter(Boolean).map((x) => `<div class="hint">${e(x)}</div>`).join("");
    const candHtml = cand.length
      ? `<ol class="cand">${cand.map((x) => `<li>${e(x.과)} <small>근거: ${e(x.근거키워드.join(", "))}</small></li>`).join("")}</ol>`
      : `<span class="warn">규칙 후보 없음</span><div class="hint">직접 고르세요(AI 추천은 다음 단계)</div>`;
    const done = c.상태 === "배분확정"
      ? `<div class="hint">${e(c.확정방법)} · ${e(c.일시)}</div>` : "";
    return `<tr data-id="${e(c.id)}">
      <td><span class="badge st-${e(c.상태)}">${e(c.상태)}</span></td>
      <td><b>${e(c.id)}</b><div class="hint">${e(c.위원회)}</div><div class="hint">기한 ${e(c.제출기한)}</div></td>
      <td>${e(c.요구내용)}${sub}</td>
      <td>${candHtml}</td>
      <td><select class="main">${orgOptions(sel)}</select>
          <details class="co"><summary>협조 과 ${c.협조과.length ? `(${c.협조과.length}) ` + e(c.협조과.join(", ")) : "선택"}</summary><div class="boxes">${coBoxes(c.id, c.협조과)}</div></details></td>
      <td><button class="primary go" ${canAssign ? "" : "disabled"}>${c.상태 === "배분확정" ? "다시 확정" : "확정"}</button>${done}</td>
    </tr>`;
  }).join("");
}

$("rows").onclick = (ev) => {
  const btn = ev.target.closest("button.go"); if (!btn) return;
  const tr = btn.closest("tr"), id = tr.dataset.id;
  const db = App.load(), c = db.cases.find((x) => x.id === id);
  const 후보 = eng.classify(c.요구내용).map((x) => x.과);
  const 주관과 = tr.querySelector("select.main").value;
  const 협조과 = [...tr.querySelectorAll(`input[name="co-${CSS.escape(id)}"]:checked`)].map((x) => x.value);
  try {
    App.assign(db, id, { 주관과, 협조과, 확정방법: 후보[0] && 주관과 === 후보[0] ? "규칙" : "수정", 후보 }, eng.org.map((o) => o.과));
    App.save(db);
    msg(`${id} 배분확정 — 주관 ${주관과}` + (협조과.filter((d) => d !== 주관과).length ? ` · 협조 ${협조과.filter((d) => d !== 주관과).join(", ")}` : ""));
    drawAssign();
  } catch (err) { msg(err.message, true); }
};
$("fState").onchange = drawAssign;
$("fMember").onchange = drawAssign;

(async () => {
  $("fState").innerHTML += App.STATES.map((s) => `<option>${s}</option>`).join("");
  try { eng = await App.loadEngine(); drawAssign(); }
  catch (err) { msg(err.message, true); }
})();
</script>
</body>
</html>
